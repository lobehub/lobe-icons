# Trusted half of the PR icon preview. Triggered when "PR Icon Preview" finishes; runs the
# default branch's code only and treats the artifact as untrusted data (see
# scripts/prPreviewWorkflow/publish.ts). Never check out or run PR code here.
name: PR Icon Preview Comment
on:
  workflow_run:
    workflows: ['PR Icon Preview']
    types: [completed]

permissions:
  actions: read # download the artifact of the triggering run
  contents: write # push images to the pr-previews branch
  pull-requests: write # create / update the sticky comment

env:
  PREVIEW_BRANCH: pr-previews

jobs:
  comment:
    name: Publish icon preview
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout default branch (trusted scripts)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'

      - name: Download preview artifact
        uses: actions/download-artifact@v4
        with:
          name: icon-preview
          path: ${{ runner.temp }}/icon-preview
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Prepare previews branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |-
          git init -q "$RUNNER_TEMP/previews"
          cd "$RUNNER_TEMP/previews"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git config http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          if git ls-remote --exit-code --heads origin "$PREVIEW_BRANCH" > /dev/null; then
            git fetch -q --depth=1 origin "$PREVIEW_BRANCH"
            git checkout -q -b "$PREVIEW_BRANCH" FETCH_HEAD
          else
            git checkout -q --orphan "$PREVIEW_BRANCH"
            printf '# PR icon previews\n\nGenerated by `.github/workflows/pr-icon-preview-comment.yml`. Do not merge.\n' > README.md
          fi

      - name: Validate artifact and build comment
        id: publish
        run: >-
          bun scripts/prPreviewWorkflow/publish.ts --artifact "$RUNNER_TEMP/icon-preview" --dest "$RUNNER_TEMP/previews" --repo "$GITHUB_REPOSITORY" --branch "$PREVIEW_BRANCH" --head-sha "$HEAD_SHA" --comment "$RUNNER_TEMP/comment.md"
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}

      # The artifact names the PR; only trust it if that PR's head is the commit this run built.
      - name: Verify pull request
        id: verify
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.publish.outputs.pr_number }}
        with:
          script: |
            const pull_number = Number(process.env.PR_NUMBER);
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number });
            const ok = pr.state === 'open' && pr.head.sha === context.payload.workflow_run.head_sha;
            if (!ok) core.notice(`Skipping #${pull_number}: closed or head moved past ${context.payload.workflow_run.head_sha}`);
            core.setOutput('ok', String(ok));

      - name: Push images
        if: steps.verify.outputs.ok == 'true' && steps.publish.outputs.has_images == 'true'
        working-directory: ${{ runner.temp }}/previews
        env:
          PR_NUMBER: ${{ steps.publish.outputs.pr_number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |-
          git add -A
          git diff --cached --quiet && exit 0
          git commit -q -m "preview: #${PR_NUMBER} @ ${HEAD_SHA::7}"
          commit=$(git rev-parse HEAD)
          for attempt in 1 2 3 4 5; do
            git push -q origin "HEAD:refs/heads/${PREVIEW_BRANCH}" && exit 0
            sleep $((attempt * 3))
            git fetch -q --depth=1 origin "$PREVIEW_BRANCH"
            git reset -q --hard FETCH_HEAD
            git cherry-pick "$commit"
          done
          exit 1

      - name: Create or update sticky comment
        if: steps.verify.outputs.ok == 'true'
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.publish.outputs.pr_number }}
          HAS_BRANDS: ${{ steps.publish.outputs.has_brands }}
          COMMENT_PATH: ${{ runner.temp }}/comment.md
        with:
          script: |
            const fs = require('node:fs');
            const marker = '<!-- lobe-icons-pr-preview -->';
            const issue_number = Number(process.env.PR_NUMBER);
            const body = fs.readFileSync(process.env.COMMENT_PATH, 'utf8');
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find(
              (comment) => comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker),
            );
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else if (process.env.HAS_BRANDS === 'true') {
              await github.rest.issues.createComment({ ...context.repo, issue_number, body });
            }
