name: Release CI
on:
  push:
    branches:
      - master
      - alpha
      - beta
      - rc
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Force release (bypass conventional commits)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
      release_type:
        description: 'Release type (when force release is true)'
        required: false
        default: 'patch'
        type: choice
        options:
          - 'patch'
          - 'minor'
          - 'major'
      full_static:
        description: 'Re-export every static icon instead of only the changed ones'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

# Every job here ends by pushing a release commit to the branch, so two runs
# must never overlap.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write # Required for OIDC
  contents: write # Required for semantic-release to push tags and commits
  issues: write # Required for semantic-release to create issues
  pull-requests: write # Required for semantic-release to comment on PRs

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: Build Static diffs against the last "Auto build static icons" commit.
          fetch-depth: 0

      # tsdown loads tsdown.config.ts natively on Node 22.18+. Node 20 falls through to optional peer `unrun`.
      - name: Setup Node.js environment
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup npm 7
        run: npm i -g npm@7 --registry=https://registry.npmjs.org

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'

      - name: Install deps
        run: bun i

      - name: CI
        run: bun run ci

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Release
        run: bun run release
        env:
          # Use the Actions token, not secrets.GH_TOKEN (that PAT's account is suspended).
          GITHUB_TOKEN: ${{ github.token }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Incremental: only icons changed since the last "Auto build static icons" commit are
      # re-exported (removed icons are deleted); shared code / dependency changes, a missing
      # baseline or full_static=true export everything. See scripts/svgWorkflow/changes.ts.
      - name: Build Static
        run: |-
          npx puppeteer browsers install chrome
          bun scripts/svgWorkflow/index.tsx --since auto
          bun run sync:md
        env:
          STATIC_FULL: ${{ github.event.inputs.full_static == 'true' }}

      - name: Commit changes
        run: |-
          git diff
          git config --global user.name "lobehubbot"
          git config --global user.email "i@lobehub.com"
          git add .
          git commit -m "✨ feat(auto): Auto build static icons" || exit 0
          git push
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build RN
        run: bun run build:rn

      - name: Release Static
        run: bun run release:static
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
