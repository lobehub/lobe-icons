# Untrusted half of the PR icon preview: runs the PR's code with a read-only token and no
# secrets, renders the changed brands and uploads the result as an artifact.
# `pr-icon-preview-comment.yml` (workflow_run) publishes the images and the sticky comment.
name: PR Icon Preview
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/**'
  # Re-render an existing PR: `gh workflow run pr-icon-preview.yml -f pr_number=123`
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request number to preview'
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read # workflow_dispatch: look up the PR's head / base

concurrency:
  group: pr-icon-preview-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  preview:
    name: Render icon preview
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate pr_number
        if: github.event_name == 'workflow_dispatch'
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |-
          if ! [[ "$PR_NUMBER" =~ ^[1-9][0-9]{0,8}$ ]]; then
            echo "::error::pr_number must be a positive integer"
            exit 1
          fi

      - name: Look up pull request
        id: pr
        if: github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: Number(process.env.PR_NUMBER),
            });
            if (pr.state !== 'open') core.warning(`#${pr.number} is ${pr.state}`);
            core.setOutput('head_sha', pr.head.sha);
            core.setOutput('base_ref', pr.base.ref);

      # The default pull_request checkout is the merge commit: HEAD^1 is the base branch tip.
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Checkout PR merge ref
        id: merge
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ inputs.pr_number }}/merge
          fetch-depth: 2
          persist-credentials: false

      # No merge ref (e.g. the PR has conflicts): render the head, diff against the merge base.
      - name: Checkout PR head
        if: github.event_name == 'workflow_dispatch' && steps.merge.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ inputs.pr_number }}/head
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve diff base
        env:
          EVENT_NAME: ${{ github.event_name }}
          MERGE_OUTCOME: ${{ steps.merge.outcome }}
          BASE_REF: ${{ steps.pr.outputs.base_ref }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |-
          if [ "$EVENT_NAME" = 'pull_request' ]; then
            base=$(git rev-parse HEAD^1)
            head="$EVENT_HEAD_SHA"
          elif [ "$MERGE_OUTCOME" = 'success' ]; then
            base=$(git rev-parse HEAD^1)
            head=$(git rev-parse HEAD^2)
          else
            git fetch -q --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
            base=$(git merge-base HEAD "origin/${BASE_REF}")
            head=$(git rev-parse HEAD)
          fi
          echo "PREVIEW_BASE=$base" >> "$GITHUB_ENV"
          echo "PREVIEW_HEAD_SHA=$head" >> "$GITHUB_ENV"
          echo "base=$base head=$head"

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'

      - name: Install deps
        run: bun i

      - name: Install Chrome for Puppeteer
        run: npx puppeteer browsers install chrome

      - name: Render previews and check conventions
        run: bun scripts/prPreviewWorkflow/index.tsx --base "$PREVIEW_BASE" --out "$RUNNER_TEMP/icon-preview"
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          HEAD_SHA: ${{ env.PREVIEW_HEAD_SHA }}

      - name: Job summary
        run: cat "$RUNNER_TEMP/icon-preview/comment.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload preview
        uses: actions/upload-artifact@v4
        with:
          name: icon-preview
          path: |
            ${{ runner.temp }}/icon-preview/summary.json
            ${{ runner.temp }}/icon-preview/images/
          if-no-files-found: error
          retention-days: 7
