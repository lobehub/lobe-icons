packages:
  - '*'
  - 'packages/*'
allowBuilds:
  core-js: true
  core-js-pure: true
  esbuild: true
  node-pty: false
  puppeteer: true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@lobehub/docs-kit@6.1.0'
  - '@lobehub/ui@5.49.0 || 6.0.0-beta.1 || 6.0.0-beta.10 || 6.0.0'
  - '@lobehub/commitlint-config@2.1.6'
  - '@lobehub/eslint-config@2.1.6'
  - '@lobehub/lint@2.1.6'
  - '@lobehub/prettier-config@2.1.6'
  - '@lobehub/remarklint-config@2.1.6'
  - '@lobehub/semantic-release-config@2.1.6'
  - '@lobehub/stylelint-config@2.1.6'
publicHoistPattern:
  - '*@umijs/lint*'
  - '*changelog*'
  - '*commitlint*'
  - '*eslint*'
  - '*postcss*'
  - '*prettier*'
  - '*remark*'
  - '*semantic-release*'
  - '*stylelint*'
overrides:
  # release-notes-generator 11.0.0 was published without wrappers/conventional-changelog-writer.js,
  # so semantic-release 21 fails with ERR_MODULE_NOT_FOUND. 11.0.1+ ships the file.
  '@semantic-release/release-notes-generator@^11.0.0': ^11.0.1
